name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"
#database_name = ""
#database_id = ""
[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "b9aa3be9-edbf-4e7b-9ae5-9bd6bf6499ab"

[[kv_namespaces]]
binding = "kv"
id = "bf6943a9d1584ce2838a495ec6ef86ed"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-r2"

#[[send_email]]
#name = "email"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
